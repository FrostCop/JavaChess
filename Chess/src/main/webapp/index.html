<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>Chess</title>
	<link rel="stylesheet" href="css/index.css">
	<script type="text/javascript" src="js/board.js" defer></script>
	<script type="text/javascript" src="js/game.js" defer></script>
</head>
<body>
	<div id="nickname" class="view">
		<div id="nickname-insert" class="section">
			<input id="nickname-insert-input" type="text" placeholder="Insert your nickname" />
		</div>
		<div id="nickname-submit" class="section">
			<button id="nickname-submit-button">
				Confirm Nickname
			</button>
		</div>
		<div id="nickname-feedback" class="section">
			<p id="nickname-feedback-text"></p>
		</div>
	</div>
	<div id="rooms" class="view">
		<div id="rooms-title" class="section">
			<h1 id="rooms-title-text">Chess Rooms</h1>
		</div>
		<div id="rooms-create" class="section">
			<div>
				<input id="rooms-create-name" type="text" placeholder="Insert the room name" />
				<button id="rooms-create-submit">
					Create Room
				</button>
			</div>
		</div>
		<div id="rooms-feedback" class="section">
			<p id="rooms-feedback-text"></p>
		</div>
		<div id="rooms-list" class="section">
			<div id="room-list-inner">
			<div class="room-list-entry">
				<p class="room-list-entry-name">Black</p>
				<div class="room-list-entry-freecolorinfo-container">
					<p class="room-list-entry-freecolorinfo"></p>
				</div>
				<div class="room-list-entry-timerinfo">
					<p class="room-list-entry-timerinfo-text"></p>
				</div>
				<button class="room-list-entry-join">
					<p class="room-list-entry-join-label">Join</p>
				</button>
			</div>
			</div>
		</div>	
	</div>
	<div id="match" class="view">
		<div id="match-info" class="section">
			<h1 id="match-info-name"></h1>
		</div>
		<div id="match-board" class="section">
			<div id="match-board-inner">
			</div>
		</div>
	</div>
</body>
</html>
